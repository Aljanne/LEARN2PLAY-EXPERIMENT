<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Admin | Learn2Play</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body { display: block; padding: 0; }
    .admin-layout { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
    .admin-page-header { margin-bottom: 24px; }
    .admin-page-header h1 { color: var(--txt); font-size: 22px; font-weight: 600; }
    .admin-page-header p  { color: var(--txt2); font-size: 14px; margin-top: 4px; }

    .users-toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .search-box {
      flex: 1; min-width: 220px; position: relative;
    }
    .search-box input {
      width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px 10px 36px; color: var(--txt); font-size: 14px; outline: none;
      transition: border-color .18s;
    }
    .search-box input:focus { border-color: var(--purple); }
    .search-box svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; stroke: var(--txt3); fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
    }
    .user-count { color: var(--txt3); font-size: 13px; }

    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th {
      text-align: left; color: var(--txt3); font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .user-table td {
      padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle;
    }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr:hover td { background: rgba(255,255,255,.025); }

    .user-avatar-cell { display: flex; align-items: center; gap: 10px; }
    .u-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg,#f472b6,#a855f7);
      display: grid; place-items: center; color:#fff; font-size:13px; font-weight:600;
      overflow: hidden;
    }
    .u-avatar img { width:100%; height:100%; object-fit:cover; }
    .u-name  { color: var(--txt); font-size: 14px; font-weight: 500; }
    .u-email { color: var(--txt3); font-size: 12px; }

    .role-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .role-pill {
      font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
    }
    .role-pill.student  { background: rgba(163,163,163,.12); color: var(--txt3); }
    .role-pill.mentor   { background: rgba(124,108,245,.18); color: var(--lavender); }
    .role-pill.coach    { background: rgba(74,222,128,.16);  color: #7ceea4; }
    .role-pill.admin    { background: rgba(251,191,36,.18);  color: var(--gold); }
    .role-pill.pending  { background: rgba(251,191,36,.1);   color: var(--gold); border: 1px dashed rgba(251,191,36,.4); }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.active   { background: var(--green); }
    .status-dot.inactive { background: var(--danger); }

    .user-actions { display: flex; gap: 6px; }
    .ua-btn {
      padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg); color: var(--txt2); transition: all .18s;
    }
    .ua-btn:hover { border-color: var(--purple); color: var(--txt); }
    .ua-btn.deactivate:hover { border-color: var(--danger); color: var(--danger); }
    .ua-btn.activate:hover   { border-color: var(--green);  color: var(--green); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--txt3); }
    .empty-state .ei { font-size: 36px; margin-bottom: 10px; }
    .empty-state h3 { color: var(--txt2); font-size: 16px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 100;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 18px; color: var(--txt); font-size: 14px; max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); transform: translateY(80px); opacity: 0;
      transition: all .3s ease; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok  { border-color: rgba(74,222,128,.4);  }
    .toast.err { border-color: rgba(248,113,113,.4); }

    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  </style>
</head>
<body class="dashboard">


  {% set active_page = 'users' %}
  {% include '_navbar.html' %}


  <div class="admin-layout">
    <div class="admin-page-header">
      <h1>User Management</h1>
      <p>View, activate/deactivate, and manage all Learn2Play accounts.</p>
    </div>

    <div class="users-toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or email…">
      </div>
      <span class="user-count" id="userCount">Loading…</span>
    </div>

    <div class="table-wrap">
      <table class="user-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Roles</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:40px;">Loading users…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
  <script>
    const tbody = document.getElementById('userTableBody');
    const toast = document.getElementById('toast');
    const searchInput = document.getElementById('searchInput');
    const myId = {{ current_user.id }};
    let allUsers = [];

    function showToast(msg, type = 'ok') {
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.className = 'toast'; }, 3500);
    }

    async function getCsrfToken() {
      const res = await fetch('/api/csrf-token', { credentials: 'same-origin' });
      const data = await res.json();
      if (!res.ok || !data.csrf_token) throw new Error('Unable to retrieve CSRF token.');
      return data.csrf_token;
    }

    function renderRolePills(container, user) {
      const allowedRoles = { student: 'Student', mentor: 'Teacher', coach: 'Coach' };
      (Array.isArray(user.roles) ? user.roles : []).forEach(role => {
        if (!Object.hasOwn(allowedRoles, role)) return;
        const pill = document.createElement('span');
        pill.className = 'role-pill ' + role;
        pill.textContent = allowedRoles[role];
        container.appendChild(pill);
      });
      if (user.is_admin) {
        const pill = document.createElement('span');
        pill.className = 'role-pill admin';
        pill.textContent = 'Admin';
        container.appendChild(pill);
      }
      (Array.isArray(user.pending_roles) ? user.pending_roles : []).forEach(role => {
        if (!Object.hasOwn(allowedRoles, role)) return;
        const pill = document.createElement('span');
        pill.className = 'role-pill pending';
        pill.textContent = 'Pending: ' + allowedRoles[role];
        container.appendChild(pill);
      });
    }

    function renderUsers(users) {
      if (!users.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 4;
        cell.style.cssText = 'text-align:center;color:var(--txt3);padding:40px;';
        cell.textContent = 'No users found.';
        row.appendChild(cell);
        tbody.replaceChildren(row);
        return;
      }
      tbody.replaceChildren();
      users.forEach(u => {
        const tr = document.createElement('tr');
        const userName = String(u.name || 'Unknown');
        const userId = Number(u.id);
        const isSelf = userId === myId;
        const cells = Array.from({ length: 4 }, () => document.createElement('td'));
        cells.forEach(cell => tr.appendChild(cell));

        const userCell = document.createElement('div');
        userCell.className = 'user-avatar-cell';
        const avatar = document.createElement('div');
        avatar.className = 'u-avatar';
        let avatarUrl;
        try {
          avatarUrl = typeof u.profile_picture === 'string' && u.profile_picture.trim()
            ? new URL(u.profile_picture, window.location.origin)
            : null;
        } catch (_) { avatarUrl = null; }
        if (avatarUrl && ['http:', 'https:'].includes(avatarUrl.protocol) && avatarUrl.origin === window.location.origin) {
          const image = document.createElement('img');
          image.src = avatarUrl.href;
          image.alt = '';
          avatar.appendChild(image);
        } else {
          avatar.textContent = userName.slice(0, 1).toUpperCase();
        }
        const identity = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'u-name';
        name.textContent = userName;
        if (isSelf) {
          const selfLabel = document.createElement('span');
          selfLabel.style.cssText = 'color:var(--txt3);font-size:11px;';
          selfLabel.textContent = ' (you)';
          name.appendChild(selfLabel);
        }
        const email = document.createElement('div');
        email.className = 'u-email';
        email.textContent = u.email || '';
        identity.append(name, email);
        userCell.append(avatar, identity);
        cells[0].appendChild(userCell);

        const roles = document.createElement('div');
        roles.className = 'role-pills';
        renderRolePills(roles, u);
        cells[1].appendChild(roles);

        const statusDot = document.createElement('span');
        statusDot.className = 'status-dot ' + (u.is_active ? 'active' : 'inactive');
        const statusText = document.createElement('span');
        statusText.style.cssText = 'color:var(--txt2);font-size:13px;margin-left:6px;';
        statusText.textContent = u.is_active ? 'Active' : 'Inactive';
        cells[2].append(statusDot, statusText);

        const actions = document.createElement('div');
        actions.className = 'user-actions';
        if (!isSelf && Number.isSafeInteger(userId)) {
          const activeButton = document.createElement('button');
          activeButton.className = 'ua-btn ' + (u.is_active ? 'deactivate' : 'activate');
          activeButton.textContent = u.is_active ? 'Deactivate' : 'Activate';
          activeButton.addEventListener('click', () => toggleActive(userId, activeButton));
          const adminButton = document.createElement('button');
          adminButton.className = 'ua-btn';
          adminButton.textContent = u.is_admin ? 'Remove Admin' : 'Make Admin';
          adminButton.addEventListener('click', () => toggleAdmin(userId, Boolean(u.is_admin), adminButton));
          actions.append(activeButton, adminButton);
        } else {
          const dash = document.createElement('span');
          dash.style.cssText = 'color:var(--txt3);font-size:12px;';
          dash.textContent = '—';
          actions.appendChild(dash);
        }
        cells[3].appendChild(actions);
        tbody.appendChild(tr);
      });
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users', { credentials: 'same-origin' });
      const data = await res.json();
      if (!data.ok) { showToast('Failed to load users.', 'err'); return; }
      allUsers = data.users;
      document.getElementById('userCount').textContent = allUsers.length + ' users total';
      renderUsers(allUsers);
    }

    async function toggleActive(id, btn) {
      btn.disabled = true;
      try {
        const token = await getCsrfToken();
        const res = await fetch('/api/admin/users/' + id + '/toggle-active', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token }, body: '{}'
        });
        const data = await res.json();
        if (data.ok) { showToast(data.message, 'ok'); loadUsers(); }
        else { showToast(data.message || 'Error.', 'err'); btn.disabled = false; }
      } catch (_) {
        showToast('Could not update account status. Please try again.', 'err');
        btn.disabled = false;
      }
    }

    async function toggleAdmin(id, isAdmin, btn) {
      btn.disabled = true;
      try {
        const token = await getCsrfToken();
        const res = await fetch('/api/admin/users/' + id + '/set-admin', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token },
          body: JSON.stringify({ is_admin: !isAdmin })
        });
        const data = await res.json();
        if (data.ok) { showToast(data.message, 'ok'); loadUsers(); }
        else { showToast(data.message || 'Error.', 'err'); btn.disabled = false; }
      } catch (_) {
        showToast('Could not update administrator access. Please try again.', 'err');
        btn.disabled = false;
      }
    }

    searchInput.addEventListener('input', function() {
      const q = this.value.toLowerCase();
      const filtered = allUsers.filter(u =>
        u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
      );
      renderUsers(filtered);
    });

    loadUsers();
  </script>
</body>
</html>
