
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Video Session | Learn2Play</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">

    <script src="https://8x8.vc/{{ jaas_app_id|e }}/external_api.js" defer></script>

    <style>
        :root {
            --bg: #0d0b1c;
            --purple: #8b5cf6;
            --purple-light: #a78bfa;
            --text: #f5f3ff;
            --muted: #a7a0c2;
            --border: rgba(255,255,255,.08);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(
                    ellipse at top left,
                    rgba(111, 66, 193, .16),
                    transparent 40%
                ),
                var(--bg);
            color: var(--text);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        /* Main page layout */

        .meeting-page {
            width: 100%;
            max-width: none;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0 24px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Dashboard-style navbar */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 24px;
            margin: 0 -24px;
            background: var(--bg);
            border-bottom: 1px solid var(--line, var(--border));
            position: relative;
            top: 0;
            z-index: 20;
            flex-shrink: 0;
            width: calc(100% + 48px);
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .meeting-header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .session-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--txt2, var(--muted));
            font-size: 14px;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 10px rgba(167,139,250,.7);
            flex-shrink: 0;
        }

        .leave-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 10px;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.2);
            color: #fca5a5;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: .2s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .leave-button:hover {
            background: rgba(239,68,68,.22);
            transform: translateY(-1px);
        }

        /* Video conference area */

        .meeting-content {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #090817;
            border: 1px solid rgba(167,139,250,.17);
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 18px 55px rgba(0,0,0,.3);
        }

        #jaas-meeting {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #jaas-meeting iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0;
        }

        /* Loading overlay */

        .meeting-loading {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #100d20;
            text-align: center;
            padding: 24px;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(167,139,250,.2);
            border-top-color: var(--purple-light);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 15px;
            font-weight: 700;
        }

        .loading-description {
            color: var(--muted);
            font-size: 12px;
            max-width: 280px;
            line-height: 1.6;
        }

        .meeting-error {
            color: #fca5a5;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Mobile layout */

        @media (max-width: 650px) {
            .meeting-page {
                padding: 0 12px 10px;
                gap: 10px;
            }

            .topbar {
                padding: 12px;
                margin: 0 -12px;
                width: calc(100% + 24px);
                gap: 10px;
            }

            .meeting-header-right {
                gap: 12px;
            }

            .session-status {
                font-size: 11px;
            }

            .leave-button {
                padding: 8px 11px;
                font-size: 11px;
            }

            .meeting-content {
                border-radius: 12px;
            }
        }

        @media (max-width: 380px) {
            .session-status {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="meeting-page">

        <!-- Simplified dashboard-style navbar -->

        <header class="topbar">

            <a class="tb-brand" href="{{ url_for('main.dashboard') }}">
                <div class="logo">L2</div>
                <span class="brand-name">Learn2Play</span>
            </a>

            <div class="meeting-header-right">

                <div class="session-status">
                    <span class="status-dot"></span>
                    Video session
                </div>

                <a href="{{ url_for('main.sessions') }}"
                   class="leave-button"
                   id="leaveMeeting">
                    Leave session
                </a>

            </div>

        </header>

        <!-- Video conference -->

        <section class="meeting-content" aria-label="Video meeting">

            <div id="jaas-meeting"></div>

            <div class="meeting-loading" id="meetingLoading">

                <div class="loading-spinner" id="loadingSpinner"></div>

                <div class="loading-title" id="loadingTitle">
                    Preparing your meeting...
                </div>

                <div class="loading-description" id="loadingDescription">
                    Please wait while we connect you to your Learn2Play session.
                </div>

            </div>

        </section>

    </main>

    <script>
        const jaasAppId = {{ jaas_app_id|tojson }};
        const meetingRoom = {{ meeting_room|tojson }};
        const participantToken = {{ participant_token|tojson }};

        const meetingContainer = document.getElementById("jaas-meeting");
        const loadingScreen = document.getElementById("meetingLoading");
        const loadingTitle = document.getElementById("loadingTitle");
        const loadingDescription = document.getElementById("loadingDescription");
        const loadingSpinner = document.getElementById("loadingSpinner");

        let meetingApi = null;

        function showMeetingError(message) {
            loadingSpinner.style.display = "none";
            loadingTitle.textContent = "Unable to load meeting";
            loadingDescription.textContent = message;
            loadingDescription.classList.add("meeting-error");
            loadingScreen.style.display = "flex";
        }

        function hideLoadingScreen() {
            loadingScreen.style.display = "none";
        }

        window.addEventListener("load", () => {

            if (!window.JitsiMeetExternalAPI) {
                showMeetingError(
                    "The video service could not be loaded. Please refresh the page or try again later."
                );
                return;
            }

            try {
                meetingApi = new JitsiMeetExternalAPI("8x8.vc", {
                    roomName: `${jaasAppId}/${meetingRoom}`,
                    jwt: participantToken,
                    parentNode: meetingContainer,
                    width: "100%",
                    height: "100%",

                    configOverwrite: {
                        prejoinConfig: {
                            enabled: true
                        }
                    }
                });

                // Allow users to see and interact with Jitsi's pre-join screen.
                hideLoadingScreen();

                console.log("[Learn2Play] JaaS API initialized");

                // When the local participant successfully joins.
                meetingApi.addListener("videoConferenceJoined", (event) => {
                    console.log("[Learn2Play] Conference joined:", event);
                    hideLoadingScreen();
                });

                // Detect JaaS errors.
                meetingApi.addListener("errorOccurred", (event) => {
                    console.error("[Learn2Play] JaaS error:", event);
                });

                // When another participant joins.
                meetingApi.addListener("participantJoined", (event) => {
                    console.log("[Learn2Play] Participant joined:", event);
                });

                // When the meeting is ready to close.
                meetingApi.addListener("readyToClose", () => {
                    console.log("[Learn2Play] Meeting ready to close");
                    window.location.href = "{{ url_for('main.sessions') }}";
                });

            } catch (error) {
                console.error(
                    "[Learn2Play] Meeting initialization failed:",
                    error
                );

                showMeetingError(
                    "Something went wrong while starting your meeting. Please return to My Sessions and try again."
                );
            }

            // Leave meeting button.
            document.getElementById("leaveMeeting").addEventListener(
                "click",
                (event) => {
                    if (meetingApi) {
                        event.preventDefault();

                        meetingApi.executeCommand("hangup");

                        setTimeout(() => {
                            window.location.href = "{{ url_for('main.sessions') }}";
                        }, 300);
                    }
                }
            );

        });
    </script>

</body>
</html>
