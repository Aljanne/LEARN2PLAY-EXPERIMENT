<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Learn2Play</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body { display: block; padding: 0; }

    /* ---- Chat shell layout ---- */
    .chat-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 57px); /* 57px = topbar height */
      max-width: 1200px;
      margin: 0 auto;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* ---- Left sidebar: thread list ---- */
    .chat-sidebar {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .chat-sidebar-header h2 { color: var(--txt); font-size: 16px; font-weight: 600; }

    /* Category tabs */
    .chat-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .chat-tab {
      flex: 1; padding: 10px 8px; font-size: 13px; font-weight: 500;
      color: var(--txt3); border: none; background: none; cursor: pointer;
      border-bottom: 2px solid transparent; transition: color .18s, border-color .18s;
    }
    .chat-tab:hover { color: var(--txt2); }
    .chat-tab.active { color: var(--txt); border-bottom-color: var(--purple); }
    .chat-tab .tab-badge {
      display: inline-block; background: var(--purple); color: #fff;
      border-radius: 999px; font-size: 10px; font-weight: 700;
      padding: 1px 6px; margin-left: 5px; vertical-align: middle;
    }
    .chat-tab .tab-badge.hidden { display: none; }

    /* Thread list */
    .thread-list {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }
    .thread-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .15s, border-color .15s;
    }
    .thread-item:hover { background: rgba(255,255,255,.04); }
    .thread-item.active {
      background: rgba(124,108,245,.1);
      border-left-color: var(--purple);
    }
    .thread-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #f472b6, #a855f7);
      display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 600;
      overflow: hidden;
    }
    .thread-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .thread-info { flex: 1; min-width: 0; }
    .thread-name {
      color: var(--txt); font-size: 13.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-preview {
      color: var(--txt3); font-size: 12px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-meta { text-align: right; flex-shrink: 0; }
    .thread-time { color: var(--txt3); font-size: 11px; }
    .thread-unread {
      display: inline-block; background: var(--purple); color: #fff;
      border-radius: 999px; font-size: 10px; font-weight: 700;
      padding: 1px 6px; margin-top: 4px;
    }
    .thread-unread.hidden { display: none; }

    /* Session thread tag */
    .session-tag {
      font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
      background: rgba(74,222,128,.14); color: #4ade80;
      display: inline-block; margin-top: 2px;
    }

    /* Empty thread list */
    .thread-empty {
      padding: 40px 20px; text-align: center; color: var(--txt3); font-size: 13px;
    }
    .thread-empty .ei { font-size: 28px; margin-bottom: 8px; }

    /* New chat button */
    .new-chat-btn {
      display: flex; align-items: center; gap: 8px;
      margin: 10px 14px 4px;
      padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 500;
      background: rgba(124,108,245,.12); color: var(--lavender);
      border: 1px solid rgba(124,108,245,.3); cursor: pointer;
      transition: all .18s;
    }
    .new-chat-btn:hover { background: var(--purple); color: #fff; border-color: var(--purple); }

    /* ---- Right: chat window ---- */
    .chat-window {
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* Chat header */
    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .chat-header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg,#f472b6,#a855f7);
      display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600;
      overflow: hidden; flex-shrink: 0;
    }
    .chat-header-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { color: var(--txt); font-size: 15px; font-weight: 600; }
    .chat-header-sub  { color: var(--txt3); font-size: 12px; margin-top: 2px; }
    .report-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
      background: rgba(248,113,113,.1); color: var(--danger);
      border: 1px solid rgba(248,113,113,.25); cursor: pointer; transition: all .18s;
    }
    .report-btn:hover { background: rgba(248,113,113,.2); }

    /* Messages area */
    .messages-area {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-row.mine { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg,#f472b6,#a855f7);
      display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 600;
      overflow: hidden;
    }
    .msg-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

    .msg-bubble {
      max-width: 68%; padding: 10px 14px; border-radius: 14px;
      font-size: 13.5px; line-height: 20px;
    }
    .msg-row.mine .msg-bubble {
      background: var(--purple); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row:not(.mine) .msg-bubble {
      background: var(--card); color: var(--txt);
      border: 1px solid var(--line); border-bottom-left-radius: 4px;
    }
    .msg-time { color: var(--txt3); font-size: 10px; margin-top: 4px; text-align: right; }
    .msg-row:not(.mine) .msg-time { text-align: left; }

    /* Chat input */
    .chat-input-bar {
      border-top: 1px solid var(--line); padding: 14px 20px;
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    .chat-input-wrap { flex: 1; position: relative; }
    .chat-input {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 14px; color: var(--txt); font-size: 14px;
      resize: none; min-height: 44px; max-height: 120px; overflow-y: auto;
      outline: none; font-family: inherit; transition: border-color .18s;
      line-height: 22px;
    }
    .chat-input:focus { border-color: var(--purple); }
    .chat-input::placeholder { color: var(--txt3); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: var(--purple); color: #fff;
      display: grid; place-items: center; cursor: pointer; border: none;
      transition: background .18s, transform .1s;
    }
    .send-btn:hover { background: var(--purple2); }
    .send-btn:active { transform: scale(.93); }
    .send-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Welcome / no-thread selected state */
    .chat-welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; color: var(--txt3); text-align: center; padding: 40px;
    }
    .chat-welcome .wi { font-size: 42px; margin-bottom: 6px; }
    .chat-welcome h3 { color: var(--txt2); font-size: 17px; font-weight: 600; }
    .chat-welcome p  { font-size: 13px; max-width: 280px; line-height: 20px; }

    /* New chat modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px; width: 420px; max-width: calc(100vw - 32px);
    }
    .modal h3 { color: var(--txt); font-size: 17px; font-weight: 600; margin-bottom: 16px; }
    .modal-search input {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; color: var(--txt); font-size: 14px; outline: none;
      transition: border-color .18s;
    }
    .modal-search input:focus { border-color: var(--purple); }
    .modal-results { margin-top: 10px; max-height: 220px; overflow-y: auto; }
    .modal-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 9px; cursor: pointer;
      transition: background .15s;
    }
    .modal-user:hover { background: rgba(124,108,245,.1); }
    .modal-user-av {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg,#60a5fa,#34d399);
      display: grid; place-items: center; color:#fff; font-size:12px; font-weight:600;
    }
    .modal-user-name { color: var(--txt); font-size: 13.5px; font-weight: 500; }
    .modal-user-role { color: var(--txt3); font-size: 11px; }
    .modal-close {
      display: block; width: 100%; margin-top: 16px; padding: 10px;
      border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
      color: var(--txt2); font-size: 13px; cursor: pointer; transition: all .18s;
    }
    .modal-close:hover { border-color: var(--purple); color: var(--txt); }

    /* Report modal */
    .report-modal .modal { width: 480px; }
    .report-reason select {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; color: var(--txt); font-size: 14px; outline: none;
      margin-bottom: 12px; transition: border-color .18s;
    }
    .report-reason select:focus { border-color: var(--purple); }
    .report-detail textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; color: var(--txt); font-size: 13px; resize: vertical;
      min-height: 80px; outline: none; font-family: inherit; transition: border-color .18s;
    }
    .report-detail textarea:focus { border-color: var(--purple); }
    .modal-submit {
      width: 100%; margin-top: 14px; padding: 11px; border-radius: 9px;
      background: var(--danger); color: #fff; border: none; font-size: 14px;
      font-weight: 500; cursor: pointer; transition: opacity .18s;
    }
    .modal-submit:hover { opacity: .85; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 100;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 18px; color: var(--txt); font-size: 14px; max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); transform: translateY(80px); opacity: 0;
      transition: all .3s ease; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok  { border-color: rgba(74,222,128,.4);  }
    .toast.err { border-color: rgba(248,113,113,.4); }

    /* Scrollbar styling */
    .messages-area::-webkit-scrollbar,
    .thread-list::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track,
    .thread-list::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb,
    .thread-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
  </style>
</head>
<body class="dashboard">

  <!-- ===== Top Navbar ===== -->

  {% set active_page = 'messages' %}
  {% include '_navbar.html' %}


  <!-- ===== Chat Shell ===== -->
  <div class="chat-shell">

    <!-- Left: thread list -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">
        <h2>Messages</h2>
      </div>

      <!-- Tabs: Peer / Sessions -->
      <div class="chat-tabs">
        <button class="chat-tab active" id="tabPeer" data-tab="peer">
          Peer Chat <span class="tab-badge hidden" id="peerBadge"></span>
        </button>
        <button class="chat-tab" id="tabSession" data-tab="session">
          Sessions <span class="tab-badge hidden" id="sessionBadge"></span>
        </button>
      </div>

      <!-- New peer chat button (only on Peer tab) -->
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New conversation
      </button>

      <div class="thread-list" id="threadList">
        <div class="thread-empty"><div class="ei">💬</div>No conversations yet.</div>
      </div>
    </aside>

    <!-- Right: chat window -->
    <div class="chat-window" id="chatWindow">
      <!-- Welcome state (default) -->
      <div class="chat-welcome" id="chatWelcome">
        <div class="wi">💬</div>
        <h3>Your Messages</h3>
        <p>Select a conversation from the left, or start a new peer chat with a fellow student.</p>
      </div>
    </div>
  </div>

  <!-- ===== New Chat Modal ===== -->
  <div class="modal-overlay hidden" id="newChatModal">
    <div class="modal">
      <h3>Start a conversation</h3>
      <div class="modal-search">
        <input type="text" id="userSearchInput" placeholder="Search students by name…" autocomplete="off">
      </div>
      <div class="modal-results" id="userSearchResults">
        <div style="color:var(--txt3);font-size:13px;padding:12px 0;">Type to search…</div>
      </div>
      <button class="modal-close" id="closeNewChat">Cancel</button>
    </div>
  </div>

  <!-- ===== Report Modal ===== -->
  <div class="modal-overlay hidden report-modal" id="reportModal">
    <div class="modal">
      <h3>Report User</h3>
      <div class="report-reason">
        <select id="reportReason">
          <option value="" disabled selected>Select a reason…</option>
        </select>
      </div>
      <div class="report-detail">
        <textarea id="reportDetails" placeholder="Describe what happened (optional)…"></textarea>
      </div>
      <button class="modal-submit" id="submitReport">Submit Report</button>
      <button class="modal-close" id="closeReport">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
  <script>
    const ME = {{ current_user.id }};
    const MY_NAME = {{ current_user.display_name | tojson }};

    const toast = document.getElementById('toast');
    const chatWindow = document.getElementById('chatWindow');
    const threadList = document.getElementById('threadList');
    const chatWelcome = document.getElementById('chatWelcome');
    const peerBadge = document.getElementById('peerBadge');
    const sessionBadge = document.getElementById('sessionBadge');

    let currentTab = 'peer';
    let currentThread = null; // { type, other_user, appointment_id }
    let allThreads = { peer: [], session: [] };
    let reportTargetId = null;
    let pollInterval = null;

    // ---- Toasts ----
    function showToast(msg, type = 'ok') {
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.className = 'toast'; }, 3500);
    }

    // ---- Time formatting ----
    function fmtTime(iso) {
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString())
        return d.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
    }
    function fmtFull(iso) {
      return new Date(iso).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- Avatar ----
    function avatarHtml(user, size = 40, cls = 'thread-avatar') {
      const inner = user && user.avatar
        ? `<img src="${escHtml(user.avatar)}" alt="">`
        : (user ? escHtml((user.name || '?')[0].toUpperCase()) : '?');
      return `<div class="${cls}" style="width:${size}px;height:${size}px;">${inner}</div>`;
    }

    // ---- Load threads ----
    async function loadThreads() {
      const res = await fetch('/api/messages/threads', { credentials: 'same-origin' });
      const data = await res.json();
      if (!data.ok) return;
      allThreads.peer = data.peer_threads;
      allThreads.session = data.session_threads;

      const peerUnread = allThreads.peer.reduce((s, t) => s + (t.unread || 0), 0);
      const sessUnread = allThreads.session.reduce((s, t) => s + (t.unread || 0), 0);
      peerBadge.textContent = peerUnread;
      peerBadge.classList.toggle('hidden', peerUnread === 0);
      sessionBadge.textContent = sessUnread;
      sessionBadge.classList.toggle('hidden', sessUnread === 0);

      renderThreadList();
    }

    function renderThreadList() {
      const threads = currentTab === 'peer' ? allThreads.peer : allThreads.session;
      document.getElementById('newChatBtn').style.display = currentTab === 'peer' ? '' : 'none';

      if (!threads.length) {
        threadList.innerHTML = `<div class="thread-empty"><div class="ei">${currentTab === 'peer' ? '💬' : '📅'}</div>${currentTab === 'peer' ? 'No peer conversations yet. Start one!' : 'No session chats yet. Book a session first!'}</div>`;
        return;
      }
      threadList.innerHTML = '';
      threads.forEach(t => {
        const item = document.createElement('div');
        item.className = 'thread-item' + (isActiveThread(t) ? ' active' : '');
        item.innerHTML = `
          ${avatarHtml(t.other_user, 40, 'thread-avatar')}
          <div class="thread-info">
            <div class="thread-name">${t.other_user ? escHtml(t.other_user.name) : 'Unknown'}</div>
            ${t.type === 'session' ? `<div class="session-tag">📅 ${escHtml(t.topic || 'Session')}</div>` : ''}
            <div class="thread-preview">${escHtml(t.last_message || '')}</div>
          </div>
          <div class="thread-meta">
            <div class="thread-time">${t.last_at ? fmtTime(t.last_at) : ''}</div>
            <div class="thread-unread ${t.unread ? '' : 'hidden'}">${t.unread}</div>
          </div>
        `;
        item.addEventListener('click', () => openThread(t));
        threadList.appendChild(item);
      });
    }

    function isActiveThread(t) {
      if (!currentThread) return false;
      if (t.type === 'peer') return currentThread.type === 'peer' && t.other_user && currentThread.other_user && t.other_user.id === currentThread.other_user.id;
      return currentThread.type === 'session' && t.appointment_id === currentThread.appointment_id;
    }

    // ---- Open a thread ----
    async function openThread(thread) {
      currentThread = thread;
      renderThreadList(); // update active state

      // Build chat window
      const name = thread.other_user ? thread.other_user.name : 'User';
      const sub = thread.type === 'session' ? `Session: ${thread.topic}` : 'Peer conversation';

      chatWindow.innerHTML = `
        <div class="chat-header">
          ${avatarHtml(thread.other_user, 36, 'chat-header-avatar')}
          <div class="chat-header-info">
            <div class="chat-header-name">${escHtml(name)}</div>
            <div class="chat-header-sub">${escHtml(sub)}</div>
          </div>
          <button class="report-btn" id="reportUserBtn">🚩 Report</button>
        </div>
        <div class="messages-area" id="messagesArea">
          <div style="text-align:center;color:var(--txt3);font-size:13px;">Loading messages…</div>
        </div>
        <div class="chat-input-bar">
          <div class="chat-input-wrap">
            <textarea class="chat-input" id="chatInput" placeholder="Message ${escHtml(name)}…" rows="1"></textarea>
          </div>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      `;

      // Wire up report button
      document.getElementById('reportUserBtn').addEventListener('click', () => openReport(thread.other_user));

      // Wire up send
      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('chatInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      await fetchMessages();

      // Auto-resize textarea
      const input = document.getElementById('chatInput');
      if (input) {
        input.addEventListener('input', () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
      }

      // Poll for new messages every 4s
      clearInterval(pollInterval);
      pollInterval = setInterval(fetchMessages, 4000);
    }

    async function fetchMessages() {
      if (!currentThread) return;
      let url;
      if (currentThread.type === 'peer') {
        url = '/api/messages/thread/' + currentThread.other_user.id;
      } else {
        url = '/api/messages/session/' + currentThread.appointment_id;
      }
      const res = await fetch(url, { credentials: 'same-origin' });
      const data = await res.json();
      if (!data.ok) return;
      renderMessages(data.messages);
      // Refresh thread list to clear unread badges
      loadThreads();
    }

    function renderMessages(msgs) {
      const area = document.getElementById('messagesArea');
      if (!area) return;
      const wasAtBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 60;

      if (!msgs.length) {
        area.innerHTML = '<div style="text-align:center;color:var(--txt3);font-size:13px;padding:20px;">No messages yet. Say hello!</div>';
        return;
      }
      area.innerHTML = '';
      msgs.forEach(m => {
        const isMine = m.sender_id === ME;
        const row = document.createElement('div');
        row.className = 'msg-row' + (isMine ? ' mine' : '');
        const avatarSrc = !isMine && currentThread && currentThread.other_user && currentThread.other_user.avatar
          ? `<img src="${escHtml(currentThread.other_user.avatar)}" alt="">` : '👤';
        row.innerHTML = `
          ${!isMine ? `<div class="msg-avatar">${avatarSrc}</div>` : ''}
          <div>
            <div class="msg-bubble">${escHtml(m.body)}</div>
            <div class="msg-time">${fmtFull(m.created_at)}</div>
          </div>
        `;
        area.appendChild(row);
      });
      if (wasAtBottom) area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      if (!currentThread) return;
      const input = document.getElementById('chatInput');
      const body = input.value.trim();
      if (!body) return;
      input.value = '';
      input.style.height = 'auto';

      const payload = {
        recipient_id: currentThread.other_user.id,
        body: body,
      };
      if (currentThread.type === 'session') {
        payload.appointment_id = currentThread.appointment_id;
      }

      const res = await fetch('/api/messages/send', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.ok) {
        await fetchMessages();
      } else {
        showToast(data.message || 'Failed to send.', 'err');
        input.value = body; // restore
      }
    }

    // ---- Report flow ----
    function openReport(user) {
      if (!user) return;
      reportTargetId = user.id;
      document.getElementById('reportModal').classList.remove('hidden');
      // Load reasons
      const sel = document.getElementById('reportReason');
      if (sel.options.length <= 1) {
        fetch('/api/report-reasons', { credentials: 'same-origin' })
          .then(r => r.json())
          .then(d => {
            if (!d.ok) return;
            d.reasons.forEach(r => {
              const opt = document.createElement('option');
              opt.value = r; opt.textContent = r;
              sel.appendChild(opt);
            });
          });
      }
    }

    document.getElementById('submitReport').addEventListener('click', async function() {
      const reason = document.getElementById('reportReason').value;
      const details = document.getElementById('reportDetails').value.trim();
      if (!reason) { showToast('Please select a reason.', 'err'); return; }

      const payload = { reported_id: reportTargetId, reason, details };
      if (currentThread && currentThread.type === 'session')
        payload.appointment_id = currentThread.appointment_id;

      const res = await fetch('/api/reports', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('reportModal').classList.add('hidden');
      showToast(data.message || (data.ok ? 'Report submitted.' : 'Error.'), data.ok ? 'ok' : 'err');
      document.getElementById('reportReason').selectedIndex = 0;
      document.getElementById('reportDetails').value = '';
    });
    document.getElementById('closeReport').addEventListener('click', () =>
      document.getElementById('reportModal').classList.add('hidden'));

    // ---- New chat modal ----
    document.getElementById('newChatBtn').addEventListener('click', () =>
      document.getElementById('newChatModal').classList.remove('hidden'));
    document.getElementById('closeNewChat').addEventListener('click', () => {
      document.getElementById('newChatModal').classList.add('hidden');
      document.getElementById('userSearchInput').value = '';
      document.getElementById('userSearchResults').innerHTML = '<div style="color:var(--txt3);font-size:13px;padding:12px 0;">Type to search…</div>';
    });

    let searchTimeout;
    document.getElementById('userSearchInput').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      const q = this.value.trim().toLowerCase();
      if (!q) {
        document.getElementById('userSearchResults').innerHTML = '<div style="color:var(--txt3);font-size:13px;padding:12px 0;">Type to search…</div>';
        return;
      }
      searchTimeout = setTimeout(async () => {
        // Search from the tutors endpoint (students only on p2p)
        // We use /api/admin/users... but that's admin only.
        // Instead, we'll search all users from /api/tutors and also check student role.
        // For peer chat we need students — fetch all and filter client-side.
        // We'll use a simple fetch to a user list that only includes students.
        const res = await fetch('/api/messages/peer-users?q=' + encodeURIComponent(q), { credentials: 'same-origin' });
        const data = await res.json();
        const container = document.getElementById('userSearchResults');
        if (!data.ok || !data.users.length) {
          container.innerHTML = '<div style="color:var(--txt3);font-size:13px;padding:12px 0;">No students found.</div>';
          return;
        }
        container.innerHTML = '';
        data.users.forEach(u => {
          const item = document.createElement('div');
          item.className = 'modal-user';
          item.innerHTML = `
            <div class="modal-user-av">${escHtml((u.name || '?')[0].toUpperCase())}</div>
            <div>
              <div class="modal-user-name">${escHtml(u.name)}</div>
              <div class="modal-user-role">Student</div>
            </div>
          `;
          item.addEventListener('click', () => {
            document.getElementById('newChatModal').classList.add('hidden');
            document.getElementById('userSearchInput').value = '';
            openThread({ type: 'peer', other_user: { id: u.id, name: u.name, avatar: u.avatar }, last_message: '', last_at: null, unread: 0 });
          });
          container.appendChild(item);
        });
      }, 300);
    });

    // ---- Tabs ----
    document.querySelectorAll('.chat-tab').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.chat-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentTab = this.dataset.tab;
        currentThread = null;
        clearInterval(pollInterval);
        chatWindow.innerHTML = '';
        chatWindow.appendChild(chatWelcome);
        renderThreadList();
      });
    });

    // ---- Navbar dropdown ----
    document.getElementById('userAvatar').addEventListener('click', () =>
      document.getElementById('profileDropdown').classList.toggle('hidden'));
    document.addEventListener('click', e => {
      if (!document.getElementById('profileMenu').contains(e.target))
        document.getElementById('profileDropdown').classList.add('hidden');
    });
    document.getElementById('logoutBtn').addEventListener('click', () =>
      fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(() => location.href = '/auth'));

    // ---- Helpers ----
    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
    }

    // ---- Init ----
    loadThreads();
  </script>
</body>
</html>
