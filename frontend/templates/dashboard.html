<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn2Play — Find your coach</title>
  <link rel="stylesheet" href="../css/styles.css">
<base target="_blank">
</head>
<body class="dashboard">

  <!-- ============ Top navbar ============ -->
  <header class="topbar">
    <a class="tb-brand" href="dashboard.html">
      <div class="logo">L2</div>
      <div class="brand-name">Learn2Play</div>
    </a>

    <div class="tb-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      <input type="text" id="searchInput" placeholder="Search tutors, coaches, subjects…">
    </div>

    <nav class="tb-nav">
      <a href="dashboard.html" class="active">Home</a>
      <a href="#" data-nav="academic">Academic Tutors</a>
      <a href="#" data-nav="gaming">Gaming Coaches</a>
      <a href="#">My Bookings</a>
    </nav>

    <div class="tb-avatar">JD</div>
  </header>

  <div class="layout">

    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="side-label">Browse</div>
      <button class="side-item active" data-cat="all">All</button>
      <button class="side-item" data-cat="academic">Academic Tutors</button>
      <button class="side-item" data-cat="gaming">Gaming Coaches</button>

      <div class="side-label">Subjects</div>
      <button class="side-item" data-subject="mathematics">Mathematics</button>
      <button class="side-item" data-subject="chemistry">Chemistry</button>
      <button class="side-item" data-subject="biology">Biology</button>
      <button class="side-item" data-subject="english">English</button>
      <button class="side-item" data-subject="valorant">Valorant</button>
      <button class="side-item" data-subject="league of legends">League of Legends</button>
      <button class="side-item" data-subject="apex legends">Apex Legends</button>

      <div class="side-cta">
        <p>New to Learn2Play? Find your perfect tutor or coach today.</p>
        <a class="cta-btn" href="login.html">Get Started</a>
      </div>
    </aside>

    <!-- ============ Tutor grid ============ -->
    <main class="content">
      <div class="grid" id="tutorGrid"></div>
      <p class="empty hidden" id="emptyState">No tutors match your search — try a different subject or keyword.</p>
    </main>

  </div>

  <script src="../js/script.js" defer></script>
</body>
</html>
