[project]
name = "learn2play"
version = "0.1.0"
description = "Learn2Play Flask application"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "email-validator>=2.0,<3.0",
    "gunicorn>=22.0,<24.0",
    "psycopg[binary]",
]

[tool.vercel.scripts]
build = "python build.py"
